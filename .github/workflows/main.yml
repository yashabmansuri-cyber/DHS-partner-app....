name: Build DHS Partner APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DHS_Partner_v12_FOREGROUND.zip.part01"
      - "DHS_Partner_v12_FOREGROUND.zip.part02"
      - "DHS_Partner_v12_FOREGROUND.zip.part03"
      - "DHS_Partner_v12_FOREGROUND.zip.part04"
      - "DHS_Partner_v12_FOREGROUND.zip.part05"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Join ZIP parts
        run: |
          cat DHS_Partner_v12_FOREGROUND.zip.part01 \
              DHS_Partner_v12_FOREGROUND.zip.part02 \
              DHS_Partner_v12_FOREGROUND.zip.part03 \
              DHS_Partner_v12_FOREGROUND.zip.part04 \
              DHS_Partner_v12_FOREGROUND.zip.part05 \
              > DHS_Partner_v12_FOREGROUND.zip

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q DHS_Partner_v12_FOREGROUND.zip -d android-project

      - name: Show project files
        run: |
          find android-project -maxdepth 3 -type f | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-APK
          path: android-project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
